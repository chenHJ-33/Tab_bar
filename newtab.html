<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>新标签页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wallpaper" id="wallpaper"></div>
  <div class="vignette"></div>

  <!-- ===================== 顶部常驻书签栏 ===================== -->
  <header class="bar" id="bar" role="navigation" aria-label="书签栏">
    <nav class="bar-items" id="barItems"></nav>

    <div class="bar-more-wrap" id="barMoreWrap" hidden>
      <button class="bar-item bar-more" id="barMore" type="button" title="更多书签">
        <span class="more-glyph">&raquo;</span>
      </button>
    </div>

    <div class="bar-spacer" id="barSpacer"></div>

    <div class="bar-tail" id="barTail"></div>
  </header>

  <!-- ===================== 页面主体 ===================== -->
  <main class="main">
    <section class="clock" aria-label="时间">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
    </section>

    <section class="search" aria-label="搜索">
      <form id="searchForm" autocomplete="off">
        <button type="button" class="engine-btn" id="engineBtn" title="选择搜索引擎">
          <img class="engine-icon" id="engineIcon" alt="">
          <span id="engineLabel">默认</span>
          <span class="caret" aria-hidden="true">&#9662;</span>
        </button>
        <input id="searchInput" type="text" placeholder="搜索，或直接输入网址" spellcheck="false" autocomplete="off">
        <button type="submit" class="go-btn" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="M16.5 16.5 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
      </form>
    </section>

    <section class="icons" id="icons" aria-label="常用网站"></section>
  </main>

  <!-- ===================== 设置 ===================== -->
  <button class="gear" id="gearBtn" type="button" title="设置" aria-label="设置">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
      <path d="M12 3.5v2.2M12 18.3v2.2M4.9 7.8l1.9 1.1M17.2 15.1l1.9 1.1M4.9 16.2l1.9-1.1M17.2 8.9l1.9-1.1"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
    </svg>
  </button>

  <aside class="settings" id="settings" hidden>
    <div class="settings-head">
      <strong>设置</strong>
      <button class="icon-btn" id="settingsClose" type="button" aria-label="关闭">✕</button>
    </div>

    <div class="settings-body">
      <!-- 壁纸 -->
      <div class="field" id="wallpaperField">
        <label>壁纸</label>
        <div class="presets" id="presets"></div>

        <div class="row">
          <button class="btn" id="wallpaperUploadBtn" type="button">上传本地图片…</button>
          <input id="wallpaperFiles" type="file" accept="image/*" multiple hidden>
        </div>

        <div class="wall-list" id="wallList"></div>
        <p class="hint" id="wallHint">支持多选，也可以把图片直接拖到页面任意位置。图片会自动压缩后存在本地（最多 8 张）。</p>

        <div class="row">
          <input id="wallpaperUrl" type="text" placeholder="或粘贴图片地址 https://..." spellcheck="false">
          <button class="btn ghost" id="wallpaperUrlApply" type="button">应用</button>
        </div>

        <label class="range-row">
          <span>遮罩暗度</span>
          <input type="range" id="dim" min="0" max="80" step="5">
          <span class="range-val" id="dimVal">35%</span>
        </label>
      </div>

      <!-- 搜索引擎 -->
      <div class="field">
        <label>搜索引擎</label>
        <select id="engine"></select>
        <div class="row" id="customEngineRow" hidden>
          <input id="customEngine" type="text" placeholder="https://example.com/search?q=%s" spellcheck="false">
          <button class="btn" id="customEngineApply" type="button">保存并使用</button>
        </div>
        <p class="hint" id="engineHint">用 <code>%s</code> 代替关键词。例：<code>https://www.bing.com/search?q=%s</code></p>
      </div>

      <!-- 书签栏 -->
      <div class="field">
        <label>书签栏</label>
        <label class="check">
          <input type="checkbox" id="barIconOnly">
          <span>只显示图标（不显示文字）</span>
        </label>
      </div>

      <!-- 常用网站 -->
      <div class="field">
        <label>常用网站</label>
        <div class="row">
          <button class="btn ghost" id="resetIcons" type="button">恢复默认图标</button>
        </div>
        <p class="hint">在页面上直接把图标拖到别的位置即可排序，顺序会自动保存；拖到末尾的「+」上则移到最后一格。</p>
      </div>

      <!-- 书签管理 -->
      <div class="field">
        <label>书签管理</label>
        <div class="row">
          <button class="btn ghost" id="openBookmarkManager" type="button">打开 Chrome 书签管理器</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- 添加网站 -->
  <dialog class="dialog" id="addDialog">
    <form method="dialog" id="addForm">
      <h3>添加网站</h3>
      <label class="dl">名称<input id="addName" type="text" placeholder="例如：知乎" required></label>
      <label class="dl">网址<input id="addUrl" type="text" placeholder="https://www.zhihu.com" required></label>
      <div class="dialog-actions">
        <button class="btn ghost" id="addCancel" type="button">取消</button>
        <button class="btn" type="submit">添加</button>
      </div>
    </form>
  </dialog>

  <!-- 拖拽上传壁纸时的提示 -->
  <div class="drop-mask" id="dropMask" hidden>
    <div class="drop-inner">
      <div class="drop-icon">🖼</div>
      <div>松手即可设为壁纸</div>
    </div>
  </div>

  <script type="module" src="js/bar.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
